# Build + push the bot image to GHCR. Component-first naming: <component>.<action>.yml.
# Pushes only on main / manual dispatch; PRs build (to catch Dockerfile breakage)
# but don't push.
name: bot · build image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/bot.build.yml"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/bot.build.yml"
  workflow_dispatch:

concurrency:
  group: bot.build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Canonical version — <tag MAJOR.MINOR>.<commit count>.
      # Computed once here and threaded into the build as RELEASE_VERSION.
      - name: Resolve version
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count HEAD)"
          TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          MM="$(printf '%s' "${TAG#v}" | awk -F. '{ if ($1 != "" && $2 != "") print $1"."$2 }')"
          [ -n "$MM" ] || MM="0.0"
          echo "RELEASE_VERSION=$MM.$COUNT" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familyguyfunnymomentsbot
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ env.RELEASE_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
